  <!-- Zipper Teeth -->
  <rect x="224" y="76" width="28" height="14" rx="4" fill="#93C5FD"/>
  <rect x="260" y="98" width="28" height="14" rx="4" fill="#93C5FD"/>
  <rect x="224" y="120" width="28" height="14" rx="4" fill="#93C5FD"/>
  <rect x="260" y="142" width="28" height="14" rx="4" fill="#93C5FD"/>
  <rect x="224" y="164" width="28" height="14" rx="4" fill="#93C5FD"/>
  <rect x="260" y="186" width="28" height="14" rx="4" fill="#93C5FD"/>

  <!-- Zipper Slider / Pull Tab -->
  <rect x="218" y="212" width="76" height="84" rx="20" fill="#F8FAFC" stroke="#3B82F6" stroke-width="8"/>
  <rect x="242" y="242" width="28" height="34" rx="8" fill="#1E293B"/>

  <!-- Inward Compression Arrows (Top Left & Top Right) -->
  <path d="M 96 58 L 152 114 M 152 114 L 152 72 M 152 114 L 110 114" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 416 58 L 360 114 M 360 114 L 360 72 M 360 114 L 402 114" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
